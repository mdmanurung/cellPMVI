[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cellpmvi"
version = "0.1.0"
description = "Multi-modal Variational Autoencoder for single-cell RNA + protein data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "scvi-tools>=1.1",
    "anndata>=0.10",
    "scanpy>=1.9",
    "torch>=2.0",
    "mudata>=0.2",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints",
    "myst-parser",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cellpmvi"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
